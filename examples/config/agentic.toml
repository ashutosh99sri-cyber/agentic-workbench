schema_version = 1

[provider]
name = "none"
credential_env = "OPENAI_API_KEY"

[policy]
excludes = ["customer-data/", "private-documents/"]
allowed_tools = [
  "repository_summary", "read_source", "search_code", "lookup_memory", "list_symbols", "trace_symbol",
]

[limits]
provider_requests = 8
tool_rounds = 6
context_bytes = 16000
max_output_tokens = 2000
request_timeout = 60

[state]
retention_days = 30
backup_retention_days = 90

[commands.unit]
argv = ["node", "--test", "test/app.test.mjs"]
timeout = 60
max_output_bytes = 1048576
# Docker execution also requires an explicitly reviewed present digest-pinned image.
